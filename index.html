<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Central de Pesquisas</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: #f2f4f8;
    color: #1f2430;
  }
  #app { min-height: 100vh; }
  a { color: inherit; }
  .muted { color: #6b7280; }
  .small { font-size: 0.85rem; }
  .center { text-align: center; }

  /* ---------- landing ---------- */
  .landing { max-width: 480px; margin: 15vh auto; text-align: center; padding: 24px; }
  .landing h1 { font-size: 1.6rem; margin-bottom: 8px; }

  /* ---------- auth screens ---------- */
  .auth-wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
  .auth-card { background: #fff; border-radius: 16px; padding: 32px; width: 100%; max-width: 360px; box-shadow: 0 10px 30px rgba(0,0,0,.08); }
  .auth-card h2 { margin-top: 0; font-size: 1.3rem; }
  .auth-card label { display: block; margin-bottom: 16px; font-weight: 600; font-size: 0.9rem; }
  .auth-card input { display: block; width: 100%; margin-top: 6px; padding: 10px 12px; border-radius: 10px; border: 1px solid #d1d5db; font-size: 1rem; }

  /* ---------- buttons ---------- */
  .btn { background: #4f46e5; color: #fff; border: none; border-radius: 10px; padding: 10px 18px; font-size: 0.95rem; font-weight: 600; cursor: pointer; }
  .btn:disabled { opacity: .55; cursor: default; }
  .btn.ghost { background: transparent; color: #4f46e5; border: 1px solid #d1d5db; }
  .btn.danger { color: #dc2626; border-color: #fecaca; }
  .btn.full { width: 100%; }
  .btn.small { padding: 6px 12px; font-size: 0.85rem; }
  .icon-btn { background: none; border: none; cursor: pointer; font-size: 1rem; padding: 4px 6px; border-radius: 6px; }
  .icon-btn:hover { background: #eef0f4; }

  /* ---------- shell / admin & coord ---------- */
  .shell { min-height: 100vh; display: flex; flex-direction: column; }
  .topbar { display: flex; align-items: center; gap: 20px; background: #fff; padding: 14px 22px; border-bottom: 1px solid #e5e7eb; flex-wrap: wrap; }
  .brand { font-weight: 700; font-size: 1.05rem; }
  .badge { font-size: 0.7rem; background: #eef0ff; color: #4f46e5; padding: 2px 8px; border-radius: 999px; margin-left: 6px; font-weight: 600; vertical-align: middle; }
  .tabs { display: flex; gap: 6px; flex: 1; flex-wrap: wrap; }
  .tab-btn { background: none; border: none; padding: 8px 14px; border-radius: 8px; cursor: pointer; font-size: 0.9rem; font-weight: 600; color: #6b7280; }
  .tab-btn.active { background: #eef0ff; color: #4f46e5; }
  .content { padding: 24px; max-width: 1100px; margin: 0 auto; width: 100%; }

  .panel-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 12px; flex-wrap: wrap; }
  .panel-head h2 { margin: 0; }

  .table-wrap { overflow-x: auto; background: #fff; border-radius: 12px; border: 1px solid #e5e7eb; }
  .resp-table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
  .resp-table th, .resp-table td { text-align: left; padding: 10px 14px; border-bottom: 1px solid #f0f1f4; white-space: nowrap; }
  .resp-table td { white-space: normal; max-width: 260px; }
  .resp-table thead th { background: #fafafe; font-size: 0.8rem; text-transform: uppercase; letter-spacing: .03em; color: #6b7280; }

  .status-badge { padding: 3px 10px; border-radius: 999px; font-size: 0.75rem; font-weight: 700; }
  .status-draft { background: #f3f4f6; color: #6b7280; }
  .status-published { background: #dcfce7; color: #16a34a; }
  .status-closed { background: #fee2e2; color: #dc2626; }

  .resp-toolbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
  .file-link { display: inline-block; margin-bottom: 2px; text-decoration: none; color: #4f46e5; }

  /* ---------- modal ---------- */
  .overlay { position: fixed; inset: 0; background: rgba(15,17,24,.45); display: flex; align-items: center; justify-content: center; z-index: 50; padding: 16px; }
  .modal { background: #fff; border-radius: 14px; padding: 24px; width: 100%; max-width: 420px; }
  .modal h3 { margin-top: 0; }
  .modal label { display: block; margin-bottom: 14px; font-weight: 600; font-size: 0.88rem; }
  .modal input, .modal select { display: block; width: 100%; margin-top: 6px; padding: 9px 11px; border-radius: 8px; border: 1px solid #d1d5db; font-size: 0.95rem; }
  .modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 18px; }

  /* ---------- survey editor ---------- */
  .editor { background: #fff; border-radius: 14px; padding: 22px; border: 1px solid #e5e7eb; margin-top: 10px; }
  .editor-head { display: flex; gap: 10px; margin-bottom: 10px; flex-wrap: wrap; }
  .title-input { flex: 1; min-width: 220px; font-size: 1.15rem; font-weight: 700; padding: 10px 12px; border-radius: 10px; border: 1px solid #d1d5db; }
  .status-select { padding: 10px 12px; border-radius: 10px; border: 1px solid #d1d5db; font-weight: 600; }
  .desc-input { width: 100%; min-height: 60px; padding: 10px 12px; border-radius: 10px; border: 1px solid #d1d5db; font-family: inherit; font-size: 0.92rem; margin-bottom: 14px; resize: vertical; }
  .editor-tabs { display: flex; gap: 6px; border-bottom: 1px solid #eef0f4; margin-bottom: 16px; }
  .editor-actions { display: flex; gap: 10px; margin-top: 20px; flex-wrap: wrap; }

  /* ---------- question builder ---------- */
  .qcard { border: 1px solid #e5e7eb; border-radius: 12px; padding: 14px; margin-bottom: 12px; background: #fafafe; }
  .qcard-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .qcard-row select.q-type { padding: 8px 10px; border-radius: 8px; border: 1px solid #d1d5db; }
  .qcard-row input.q-label { flex: 1; min-width: 180px; padding: 8px 10px; border-radius: 8px; border: 1px solid #d1d5db; }
  .q-required { display: flex; align-items: center; gap: 6px; font-size: 0.82rem; color: #6b7280; white-space: nowrap; }
  .qcard-actions { display: flex; gap: 2px; margin-left: auto; }
  .q-options { margin-top: 12px; padding-left: 4px; }
  .opt-row { display: flex; gap: 6px; margin-bottom: 6px; align-items: center; }
  .opt-row input { flex: 1; padding: 7px 10px; border-radius: 8px; border: 1px solid #d1d5db; }
  .opt-row input[type=file] { flex: 0 0 120px; padding: 3px; border: none; font-size: 0.72rem; }
  .opt-row input.opt-sub-input { flex: 0 0 150px; }
  .opt-photo { display: flex; align-items: center; gap: 4px; flex: 0 0 auto; }
  .opt-photo-thumb { width: 34px; height: 34px; border-radius: 50%; object-fit: cover; flex-shrink: 0; background: #e5e7eb; }
  .candidate-hint { background: #eef0ff; color: #4f46e5; border-radius: 10px; padding: 10px 14px; font-size: 0.85rem; margin-bottom: 10px; }

  /* ---------- resumo de votos ---------- */
  .tally-block { background: #fff; border: 1px solid #e5e7eb; border-radius: 12px; padding: 14px 16px; margin-bottom: 14px; }
  .tally-block h4 { margin: 0 0 10px; }
  .tally-photo { width: 26px; height: 26px; border-radius: 50%; object-fit: cover; vertical-align: middle; margin-right: 8px; }

  /* ---------- theme editor ---------- */
  .theme-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
  .theme-controls label { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; font-weight: 600; font-size: 0.9rem; }
  .theme-controls input[type=color] { width: 48px; height: 32px; border: none; border-radius: 6px; cursor: pointer; }
  .file-field { margin-bottom: 14px; }
  .file-field label { display: block; font-weight: 600; font-size: 0.9rem; margin-bottom: 6px; }
  .preview-frame { width: 100%; height: 520px; border: 1px solid #e5e7eb; border-radius: 12px; background: #fff; }
  @media (max-width: 800px) { .theme-grid { grid-template-columns: 1fr; } }

  /* ---------- settings ---------- */
  .settings-card { background: #fff; border: 1px solid #e5e7eb; border-radius: 12px; padding: 20px; margin-bottom: 16px; max-width: 420px; }
  .settings-card label { display: block; margin-bottom: 12px; font-weight: 600; font-size: 0.88rem; }
  .settings-card input { display: block; width: 100%; margin-top: 6px; padding: 9px 11px; border-radius: 8px; border: 1px solid #d1d5db; }
  .link-box { display: block; background: #f3f4f6; padding: 10px 12px; border-radius: 8px; font-size: 0.8rem; word-break: break-all; }

  /* ---------- toast ---------- */
  .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(20px); background: #1f2430; color: #fff; padding: 12px 18px; border-radius: 10px; font-size: 0.9rem; opacity: 0; transition: opacity .2s, transform .2s; z-index: 100; max-width: 90vw; }
  .toast.toast-error { background: #dc2626; }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>
<div id="app">Carregando...</div>

<script>
"use strict";

// ============================================================
// estado global
// ============================================================
let ADMIN_TOKEN = sessionStorage.getItem('cp_admin_token') || null;
let COORD_TOKEN = sessionStorage.getItem('cp_coord_token') || null;
let COORD_GROUPS = JSON.parse(sessionStorage.getItem('cp_coord_groups') || '[]');
let lastUsedSecret = sessionStorage.getItem('cp_admin_secret') || '';

let adminTab = 'surveys';
let editorState = null;
let editorTab = 'questions';
let coordCurrentSurvey = null;

class UserError extends Error {}

function app() { return document.getElementById('app'); }

// ============================================================
// util
// ============================================================
function escapeHtml(str) {
  return String(str == null ? '' : str).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
function formatBytes(n) {
  n = Number(n) || 0;
  if (n < 1024) return n + ' B';
  if (n < 1024 * 1024) return (n / 1024).toFixed(1) + ' KB';
  return (n / 1024 / 1024).toFixed(1) + ' MB';
}
function formatDate(ts) {
  try { return new Date(ts).toLocaleString('pt-BR', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' }); }
  catch (e) { return ''; }
}
function newId(prefix) { return prefix + Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }
function swap(arr, i, j) { const t = arr[i]; arr[i] = arr[j]; arr[j] = t; }
function statusLabel(s) { return s === 'published' ? 'Publicada' : s === 'closed' ? 'Encerrada' : 'Rascunho'; }
function defaultThemeClient() {
  return { bgColor: '#f2f4f8', cardColor: '#ffffff', textColor: '#1f2430', accentColor: '#4f46e5', buttonTextColor: '#ffffff', backgroundImage: null, logoImage: null };
}

function showToast(msg) {
  const t = document.createElement('div');
  t.className = 'toast';
  t.textContent = msg;
  document.body.appendChild(t);
  requestAnimationFrame(() => t.classList.add('show'));
  setTimeout(() => { t.classList.remove('show'); setTimeout(() => t.remove(), 300); }, 3000);
}
function showError(msg) {
  const t = document.createElement('div');
  t.className = 'toast toast-error';
  t.textContent = msg;
  document.body.appendChild(t);
  requestAnimationFrame(() => t.classList.add('show'));
  setTimeout(() => { t.classList.remove('show'); setTimeout(() => t.remove(), 300); }, 4000);
}

async function api(path, opts) {
  opts = opts || {};
  const headers = {};
  let payload;
  if (opts.body !== undefined) { headers['Content-Type'] = 'application/json'; payload = JSON.stringify(opts.body); }
  if (opts.auth === 'admin' && ADMIN_TOKEN) headers['Authorization'] = 'Bearer ' + ADMIN_TOKEN;
  if (opts.auth === 'coord' && COORD_TOKEN) headers['Authorization'] = 'Bearer ' + COORD_TOKEN;
  const res = await fetch('/api' + path, { method: opts.method || 'GET', headers, body: payload });
  let data = null;
  try { data = await res.json(); } catch (e) { /* sem corpo json */ }
  if (!res.ok) {
    const err = new Error((data && data.error) || ('http_' + res.status));
    err.status = res.status; err.data = data;
    throw err;
  }
  return data;
}

async function withAuthGuard(role, fn) {
  try { await fn(); }
  catch (err) {
    if (err && err.status === 401) {
      showError('Sessão expirada. Faça login novamente.');
      role === 'admin' ? logoutAdmin() : logoutCoord();
    } else {
      console.error(err);
      showError('Ocorreu um erro. Tente novamente.');
    }
  }
}

function compressImage(file, maxDim, quality) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = () => reject(new Error('read_error'));
    reader.onload = (e) => {
      const img = new Image();
      img.onerror = () => reject(new Error('image_error'));
      img.onload = () => {
        let { width, height } = img;
        if (width > maxDim || height > maxDim) {
          const scale = maxDim / Math.max(width, height);
          width = Math.round(width * scale);
          height = Math.round(height * scale);
        }
        const canvas = document.createElement('canvas');
        canvas.width = width; canvas.height = height;
        canvas.getContext('2d').drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL('image/jpeg', quality).split(',')[1]);
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  });
}
function getGeoLocation(timeoutMs) {
  return new Promise((resolve, reject) => {
    if (!navigator.geolocation) return reject(new Error('unsupported'));
    navigator.geolocation.getCurrentPosition(
      (pos) => resolve({ lat: pos.coords.latitude, lng: pos.coords.longitude, accuracy: pos.coords.accuracy }),
      (err) => reject(err),
      { enableHighAccuracy: true, timeout: timeoutMs || 12000, maximumAge: 0 }
    );
  });
}
function fileToBase64(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(String(reader.result).split(',')[1]);
    reader.onerror = () => reject(new Error('read_error'));
    reader.readAsDataURL(file);
  });
}
function triggerBlobDownload(blob, filename) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename || 'arquivo';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 15000);
}
function csvEscape(v) {
  v = String(v == null ? '' : v);
  if (/["\n,]/.test(v)) v = '"' + v.replace(/"/g, '""') + '"';
  return v;
}

// ============================================================
// roteador
// ============================================================
function parseHash() {
  const h = location.hash.replace(/^#\/?/, '');
  return h.split('/').filter(Boolean);
}
window.addEventListener('hashchange', route);

function route() {
  const parts = parseHash();
  if (parts[0] === 'f' && parts[1]) return renderPublicForm(parts[1]);
  if (parts[0] === 'admin') return renderAdminEntry(parts[1]);
  if (parts[0] === 'coord') return renderCoordEntry();
  return renderLanding();
}

function renderLanding() {
  app().innerHTML = `<div class="landing">
    <h1>Central de Pesquisas</h1>
    <p class="muted">Se você recebeu um link de formulário, acesse por ele diretamente.</p>
  </div>`;
}

// ============================================================
// formulário público (quem responde)
// ============================================================
function formThemeCss(theme) {
  theme = theme || defaultThemeClient();
  const bgImg = theme.backgroundImage
    ? `background-image:url('/api/files/${theme.backgroundImage}'); background-size:cover; background-position:center; background-attachment:fixed;`
    : '';
  return `<style>
    .pf-body { margin:0; min-height:100vh; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif; background:${theme.bgColor}; color:${theme.textColor}; ${bgImg} }
    .pf-wrap { max-width:640px; margin:0 auto; padding:36px 16px; }
    .pf-card { background:${theme.cardColor}; border-radius:16px; padding:30px; box-shadow:0 10px 30px rgba(0,0,0,.14); }
    .pf-logo { max-width:200px; max-height:100px; display:block; margin:0 auto 18px; }
    .pf-title { font-size:1.6rem; font-weight:700; margin:0 0 8px; color:${theme.textColor}; }
    .pf-desc { margin:0 0 24px; opacity:.85; white-space:pre-wrap; color:${theme.textColor}; }
    .pf-q { margin-bottom:22px; }
    .pf-qlabel { display:block; font-weight:600; margin-bottom:8px; color:${theme.textColor}; }
    .pf-req { color:#dc2626; margin-left:4px; }
    .pf-input, .pf-textarea, .pf-select { width:100%; padding:11px 12px; border-radius:10px; border:1px solid rgba(0,0,0,.18); font-size:1rem; font-family:inherit; background:#fff; color:#1f2430; }
    .pf-textarea { min-height:100px; resize:vertical; }
    .pf-choice-row { display:flex; align-items:center; gap:8px; margin-bottom:8px; }
    .pf-choice-row input { accent-color:${theme.accentColor}; width:18px; height:18px; flex-shrink:0; }
    .pf-choice-row label { color:${theme.textColor}; }
    .pf-cand-row { display:flex; align-items:center; gap:12px; padding:10px 12px; border:1px solid rgba(0,0,0,.14); border-radius:12px; margin-bottom:8px; cursor:pointer; }
    .pf-cand-row input { accent-color:${theme.accentColor}; width:20px; height:20px; flex-shrink:0; }
    .pf-cand-photo { width:50px; height:50px; border-radius:50%; object-fit:cover; flex-shrink:0; background:#e5e7eb; }
    .pf-cand-info { display:flex; flex-direction:column; }
    .pf-cand-name { font-weight:600; color:${theme.textColor}; }
    .pf-cand-sub { font-size:.8rem; opacity:.75; color:${theme.textColor}; }
    .pf-btn { background:${theme.accentColor}; color:${theme.buttonTextColor}; border:none; border-radius:10px; padding:13px 24px; font-size:1rem; font-weight:700; cursor:pointer; width:100%; }
    .pf-btn:disabled { opacity:.6; cursor:default; }
    .pf-fielderr { color:#dc2626; font-size:.82rem; margin-top:5px; }
    .pf-locnote { margin:0; opacity:.75; font-size:.9rem; color:${theme.textColor}; }
    .pf-success, .pf-closed { text-align:center; padding:50px 22px; }
  </style>`;
}

function renderQuestionField(q) {
  const req = q.required ? '<span class="pf-req">*</span>' : '';
  const label = `<label class="pf-qlabel">${escapeHtml(q.label || '(pergunta sem título)')}${req}</label>`;
  let field = '';
  switch (q.type) {
    case 'short_text':
      field = `<input class="pf-input" type="text" name="${q.id}" ${q.required ? 'required' : ''}>`; break;
    case 'long_text':
      field = `<textarea class="pf-textarea" name="${q.id}" ${q.required ? 'required' : ''}></textarea>`; break;
    case 'number':
      field = `<input class="pf-input" type="number" name="${q.id}" ${q.required ? 'required' : ''}>`; break;
    case 'date':
      field = `<input class="pf-input" type="date" name="${q.id}" ${q.required ? 'required' : ''}>`; break;
    case 'dropdown':
      field = `<select class="pf-select" name="${q.id}" ${q.required ? 'required' : ''}><option value="">Selecione...</option>${(q.options || []).map(o => `<option value="${escapeHtml(o)}">${escapeHtml(o)}</option>`).join('')}</select>`; break;
    case 'single_choice':
    case 'multi_choice': {
      const isRadio = q.type === 'single_choice';
      const inputType = isRadio ? 'radio' : 'checkbox';
      const hasPhotos = Array.isArray(q.optionMeta) && q.optionMeta.some((m) => m && m.image);
      if (hasPhotos) {
        field = (q.options || []).map((o, i) => {
          const meta = (q.optionMeta && q.optionMeta[i]) || {};
          const photo = meta.image ? `<img class="pf-cand-photo" src="/api/files/${meta.image}">` : '<div class="pf-cand-photo"></div>';
          return `<label class="pf-cand-row" for="${q.id}_${i}">
            <input type="${inputType}" name="${q.id}" value="${escapeHtml(o)}" id="${q.id}_${i}" ${isRadio && q.required ? 'required' : ''}>
            ${photo}
            <span class="pf-cand-info"><span class="pf-cand-name">${escapeHtml(o)}</span>${meta.sub ? `<span class="pf-cand-sub">${escapeHtml(meta.sub)}</span>` : ''}</span>
          </label>`;
        }).join('');
      } else {
        field = (q.options || []).map((o, i) => `<div class="pf-choice-row"><input type="${inputType}" name="${q.id}" value="${escapeHtml(o)}" id="${q.id}_${i}" ${isRadio && q.required ? 'required' : ''}><label for="${q.id}_${i}">${escapeHtml(o)}</label></div>`).join('');
      }
      break;
    }
    case 'file':
      field = `<input class="pf-input" type="file" name="${q.id}" ${q.required ? 'required' : ''}><div class="pf-fielderr" data-errfor="${q.id}"></div>`; break;
    case 'location':
      field = `<p class="pf-locnote">📍 Vamos pedir para usar sua localização atual quando você enviar o formulário.</p><div class="pf-fielderr" data-errfor="${q.id}"></div>`; break;
    default:
      field = `<input class="pf-input" type="text" name="${q.id}">`;
  }
  return `<div class="pf-q" data-qid="${q.id}" data-qtype="${q.type}">${label}${field}</div>`;
}

function formBodyHtml(survey, opts) {
  opts = opts || {};
  const theme = survey.theme || defaultThemeClient();
  const logo = theme.logoImage ? `<img class="pf-logo" src="/api/files/${theme.logoImage}">` : '';
  const questionsHtml = (survey.questions || []).map(renderQuestionField).join('');
  return `<div class="pf-body"><div class="pf-wrap"><div class="pf-card">
    ${logo}
    <div class="pf-title">${escapeHtml(survey.title || '')}</div>
    ${survey.description ? `<div class="pf-desc">${escapeHtml(survey.description)}</div>` : ''}
    <form id="pf-form" ${opts.preview ? 'onsubmit="return false;"' : ''}>
      ${questionsHtml}
      <button type="submit" class="pf-btn" ${opts.preview ? 'disabled' : ''}>Enviar</button>
    </form>
  </div></div></div>`;
}

async function renderPublicForm(surveyId) {
  app().innerHTML = '<p class="muted center" style="padding:60px 20px;">Carregando...</p>';
  let data;
  try { data = await api('/survey/' + surveyId); }
  catch (err) {
    app().innerHTML = formThemeCss(null) + `<div class="pf-body"><div class="pf-wrap"><div class="pf-card pf-closed"><h2>Formulário não encontrado</h2></div></div></div>`;
    return;
  }
  if (data.closed) {
    app().innerHTML = formThemeCss(null) + `<div class="pf-body"><div class="pf-wrap"><div class="pf-card pf-closed"><h2>${escapeHtml(data.title || 'Formulário')}</h2><p>Este formulário não está recebendo respostas no momento.</p></div></div></div>`;
    return;
  }
  app().innerHTML = formThemeCss(data.theme) + formBodyHtml(data);
  document.getElementById('pf-form').addEventListener('submit', (e) => handlePublicSubmit(e, data));
}

async function handlePublicSubmit(e, survey) {
  e.preventDefault();
  const form = e.target;
  const btn = form.querySelector('button[type=submit]');
  btn.disabled = true; btn.textContent = 'Enviando...';
  form.querySelectorAll('.pf-fielderr').forEach((el) => (el.textContent = ''));
  try {
    const answers = {};
    const files = [];
    for (const q of (survey.questions || [])) {
      const sel = `[name="${CSS.escape(q.id)}"]`;
      if (q.type === 'multi_choice') {
        answers[q.id] = [...form.querySelectorAll(sel + ':checked')].map((i) => i.value);
      } else if (q.type === 'file') {
        const input = form.querySelector(sel);
        const file = input && input.files && input.files[0];
        if (file) {
          try {
            if (file.type.startsWith('image/') && file.size > 700 * 1024) {
              const b64 = await compressImage(file, 1600, 0.75);
              files.push({ questionId: q.id, name: file.name, mime: 'image/jpeg', dataBase64: b64 });
            } else if (file.size > 4 * 1024 * 1024) {
              throw new UserError('maior que 4MB');
            } else {
              const b64 = await fileToBase64(file);
              files.push({ questionId: q.id, name: file.name, mime: file.type || 'application/octet-stream', dataBase64: b64 });
            }
          } catch (fe) {
            const errEl = form.querySelector(`[data-errfor="${q.id}"]`);
            if (errEl) errEl.textContent = 'Este arquivo é muito grande (máx. 4MB). Envie um arquivo menor.';
            throw new UserError('Arquivo muito grande em: ' + (q.label || ''));
          }
        } else if (q.required) {
          throw new UserError('Envie um arquivo para: ' + (q.label || 'pergunta obrigatória'));
        }
      } else if (q.type === 'location') {
        try {
          answers[q.id] = await getGeoLocation();
        } catch (locErr) {
          const errEl = form.querySelector(`[data-errfor="${q.id}"]`);
          if (q.required) {
            if (errEl) errEl.textContent = 'Não foi possível obter sua localização. Ative o GPS/localização do aparelho, permita o acesso quando o navegador pedir, e tente enviar de novo.';
            throw new UserError('Localização obrigatória não obtida.');
          }
          answers[q.id] = null;
        }
      } else {
        const el = form.querySelector(sel);
        answers[q.id] = el ? el.value : '';
      }
    }
    await api('/survey/' + survey.id + '/responses', { method: 'POST', body: { answers, files } });
    app().innerHTML = formThemeCss(survey.theme) + `<div class="pf-body"><div class="pf-wrap"><div class="pf-card pf-success"><h2>Obrigado!</h2><p>Sua resposta foi registrada com sucesso.</p></div></div></div>`;
  } catch (err) {
    showError(err instanceof UserError ? err.message : 'Não foi possível enviar sua resposta. Tente novamente.');
    btn.disabled = false; btn.textContent = 'Enviar';
  }
}

// ---------- construtor de perguntas ----------
const QUESTION_TYPES = [
  ['short_text', 'Texto curto'],
  ['long_text', 'Texto longo'],
  ['single_choice', 'Múltipla escolha (uma opção)'],
  ['multi_choice', 'Caixas de seleção (várias opções)'],
  ['dropdown', 'Lista suspensa'],
  ['date', 'Data'],
  ['number', 'Número'],
  ['file', 'Arquivo / imagem'],
  ['location', 'Localização (GPS)'],
];
function needsOptions(type) { return ['single_choice', 'multi_choice', 'dropdown'].includes(type); }
function supportsPhotoOptions(type) { return type === 'single_choice' || type === 'multi_choice'; }
function syncOptionMeta(q) {
  if (!supportsPhotoOptions(q.type)) return;
  if (!Array.isArray(q.optionMeta)) q.optionMeta = [];
  const n = (q.options || []).length;
  while (q.optionMeta.length < n) q.optionMeta.push({});
  q.optionMeta.length = n;
}

function questionCardHtml(q, idx) {
  syncOptionMeta(q);
  return `<div class="qcard" data-idx="${idx}">
    <div class="qcard-row">
      <select class="q-type">${QUESTION_TYPES.map(([v, l]) => `<option value="${v}" ${q.type === v ? 'selected' : ''}>${l}</option>`).join('')}</select>
      <input class="q-label" placeholder="Digite a pergunta..." value="${escapeHtml(q.label || '')}">
      <label class="q-required"><input type="checkbox" class="q-req" ${q.required ? 'checked' : ''}> obrigatória</label>
      <div class="qcard-actions">
        <button type="button" class="icon-btn q-up" title="Mover para cima">↑</button>
        <button type="button" class="icon-btn q-down" title="Mover para baixo">↓</button>
        <button type="button" class="icon-btn q-del" title="Excluir pergunta">🗑</button>
      </div>
    </div>
    ${needsOptions(q.type) ? `<div class="q-options">
      ${supportsPhotoOptions(q.type) ? '<div class="candidate-hint">📷 Nesse tipo de pergunta dá pra colocar uma foto e um subtítulo (ex: partido/número) em cada opção — útil para listas de candidatos.</div>' : ''}
      ${(q.options || []).map((o, oi) => optionRowHtml(o, oi, q)).join('')}<button type="button" class="btn ghost small q-add-opt">+ opção</button></div>` : ''}
  </div>`;
}
function optionRowHtml(opt, oi, q) {
  const showPhoto = supportsPhotoOptions(q.type);
  const meta = showPhoto ? ((q.optionMeta && q.optionMeta[oi]) || {}) : {};
  const photoHtml = showPhoto ? `<div class="opt-photo">
      ${meta.image ? `<img src="/api/files/${meta.image}" class="opt-photo-thumb">` : ''}
      <input type="file" accept="image/*" class="opt-photo-input" title="Foto do candidato">
      ${meta.image ? '<button type="button" class="icon-btn opt-photo-remove" title="Remover foto">✕</button>' : ''}
    </div>` : '';
  const subHtml = showPhoto ? `<input class="opt-sub-input" placeholder="Partido/número (opcional)" value="${escapeHtml(meta.sub || '')}">` : '';
  return `<div class="opt-row" data-oi="${oi}">${photoHtml}<input class="opt-input" value="${escapeHtml(opt)}" placeholder="Opção ${oi + 1}">${subHtml}<button type="button" class="icon-btn opt-del">✕</button></div>`;
}
function paintQuestionsList() {
  document.getElementById('questions-list').innerHTML = editorState.questions.map((q, idx) => questionCardHtml(q, idx)).join('') || '<p class="muted">Nenhuma pergunta ainda. Clique em "+ Nova pergunta".</p>';
}
function renderQuestionsEditor() {
  const body = document.getElementById('editor-body');
  body.innerHTML = `<div id="questions-list"></div><button type="button" class="btn" id="add-question">+ Nova pergunta</button>`;
  paintQuestionsList();
  document.getElementById('add-question').onclick = () => {
    editorState.questions.push({ id: newId('q'), type: 'short_text', label: '', required: false, options: [] });
    paintQuestionsList();
  };
  const list = document.getElementById('questions-list');
  list.addEventListener('input', (e) => {
    const card = e.target.closest('.qcard'); if (!card) return;
    const q = editorState.questions[+card.dataset.idx]; if (!q) return;
    if (e.target.classList.contains('q-label')) q.label = e.target.value;
    if (e.target.classList.contains('opt-input')) { const oi = +e.target.closest('.opt-row').dataset.oi; q.options[oi] = e.target.value; }
    if (e.target.classList.contains('opt-sub-input')) {
      const oi = +e.target.closest('.opt-row').dataset.oi;
      syncOptionMeta(q);
      q.optionMeta[oi] = { ...(q.optionMeta[oi] || {}), sub: e.target.value };
    }
  });
  list.addEventListener('change', (e) => {
    const card = e.target.closest('.qcard'); if (!card) return;
    const q = editorState.questions[+card.dataset.idx]; if (!q) return;
    if (e.target.classList.contains('q-type')) {
      q.type = e.target.value;
      if (needsOptions(q.type) && !(q.options || []).length) q.options = ['Opção 1', 'Opção 2'];
      syncOptionMeta(q);
      paintQuestionsList();
    }
    if (e.target.classList.contains('q-req')) q.required = e.target.checked;
    if (e.target.classList.contains('opt-photo-input')) {
      const oi = +e.target.closest('.opt-row').dataset.oi;
      const file = e.target.files[0];
      if (file) {
        withAuthGuard('admin', async () => {
          const base64 = await compressImage(file, 500, 0.85);
          const { fileId } = await api('/admin/upload-theme-image', { method: 'POST', auth: 'admin', body: { name: file.name, mime: 'image/jpeg', dataBase64: base64 } });
          syncOptionMeta(q);
          q.optionMeta[oi] = { ...(q.optionMeta[oi] || {}), image: fileId };
          paintQuestionsList();
        });
      }
    }
  });
  list.addEventListener('click', (e) => {
    const card = e.target.closest('.qcard'); if (!card) return;
    const idx = +card.dataset.idx; const q = editorState.questions[idx]; if (!q) return;
    if (e.target.classList.contains('q-del')) { editorState.questions.splice(idx, 1); paintQuestionsList(); }
    else if (e.target.classList.contains('q-up') && idx > 0) { swap(editorState.questions, idx, idx - 1); paintQuestionsList(); }
    else if (e.target.classList.contains('q-down') && idx < editorState.questions.length - 1) { swap(editorState.questions, idx, idx + 1); paintQuestionsList(); }
    else if (e.target.classList.contains('q-add-opt')) { q.options.push('Opção ' + (q.options.length + 1)); syncOptionMeta(q); paintQuestionsList(); }
    else if (e.target.classList.contains('opt-del')) { const oi = +e.target.closest('.opt-row').dataset.oi; q.options.splice(oi, 1); if (Array.isArray(q.optionMeta)) q.optionMeta.splice(oi, 1); paintQuestionsList(); }
    else if (e.target.classList.contains('opt-photo-remove')) { const oi = +e.target.closest('.opt-row').dataset.oi; syncOptionMeta(q); q.optionMeta[oi] = { ...(q.optionMeta[oi] || {}), image: null }; paintQuestionsList(); }
  });
}

  const map = { 't-bg': 'bgColor', 't-card': 'cardColor', 't-text': 'textColor', 't-accent': 'accentColor', 't-btntext': 'buttonTextColor' };
  Object.keys(map).forEach((id) => {
    document.getElementById(id).addEventListener('input', (e) => { editorState.theme[map[id]] = e.target.value; paintPreview(); });
  });
  document.getElementById('t-bgimg').addEventListener('change', (e) => handleThemeImageUpload(e, 'backgroundImage', 1920, 0.7));
  document.getElementById('t-logo').addEventListener('change', (e) => handleThemeImageUpload(e, 'logoImage', 640, 0.85));
  const bgRemove = document.getElementById('t-bgimg-remove');
  if (bgRemove) bgRemove.onclick = () => { editorState.theme.backgroundImage = null; renderThemeEditor(); };
  const logoRemove = document.getElementById('t-logo-remove');
  if (logoRemove) logoRemove.onclick = () => { editorState.theme.logoImage = null; renderThemeEditor(); };
  paintPreview();
}
async function handleThemeImageUpload(e, field, maxDim, quality) {
  const file = e.target.files[0]; if (!file) return;
  await withAuthGuard('admin', async () => {
    const base64 = await compressImage(file, maxDim, quality);
    const { fileId } = await api('/admin/upload-theme-image', { method: 'POST', auth: 'admin', body: { name: file.name, mime: 'image/jpeg', dataBase64: base64 } });
    editorState.theme[field] = fileId;
    renderThemeEditor();
  });
}
function paintPreview() {
  const frame = document.getElementById('preview-frame');
  if (!frame) return;
  const titleEl = document.getElementById('ed-title');
  const survey = { title: titleEl ? titleEl.value : editorState.title, description: editorState.description, theme: editorState.theme, questions: editorState.questions };
  frame.srcdoc = `<!doctype html><html><head><meta charset="utf-8">${formThemeCss(survey.theme)}</head><body>${formBodyHtml(survey, { preview: true })}</body></html>`;
}

// ---------- respostas (usado por admin e coordenador) ----------
function renderAnswerCell(q, r) {
  if (q.type === 'file') {
    const files = (r.files && r.files[q.id]) || [];
    if (!files.length) return '<span class="muted">—</span>';
    return files.map((f) => `<a href="#" class="file-link" data-fileid="${f.fileId}" data-filename="${escapeHtml(f.name)}">📎 ${escapeHtml(f.name)} (${formatBytes(f.size)})</a>`).join('<br>');
  }
  if (q.type === 'location') {
    const loc = r.answers ? r.answers[q.id] : null;
    if (!loc || typeof loc.lat !== 'number') return '<span class="muted">—</span>';
    return `<a class="file-link" href="https://www.google.com/maps?q=${loc.lat},${loc.lng}" target="_blank" rel="noopener">📍 ver no mapa</a>`;
  }
  const val = r.answers ? r.answers[q.id] : undefined;
  if (Array.isArray(val)) return escapeHtml(val.join(', '));
  return escapeHtml(val == null ? '' : String(val));
}
function computeTally(survey, responses) {
  const qs = (survey.questions || []).filter((q) => q.type === 'single_choice' || q.type === 'multi_choice');
  return qs.map((q) => {
    const counts = {};
    (q.options || []).forEach((o) => { counts[o] = 0; });
    let answered = 0;
    responses.forEach((r) => {
      const val = r.answers ? r.answers[q.id] : undefined;
      if (val == null || val === '') return;
      const vals = Array.isArray(val) ? val : [val];
      const valid = vals.filter((v) => v !== '' && v != null);
      if (!valid.length) return;
      answered++;
      valid.forEach((v) => { counts[v] = (counts[v] || 0) + 1; });
    });
    const rows = Object.keys(counts).map((label) => {
      const oi = (q.options || []).indexOf(label);
      return { label, count: counts[label], meta: (q.optionMeta && q.optionMeta[oi]) || null };
    }).sort((a, b) => b.count - a.count);
    return { q, rows, answered };
  });
}
function tallySectionHtml(survey, responses) {
  const groups = computeTally(survey, responses);
  if (!groups.length) return '<p class="muted">Nenhuma pergunta de múltipla escolha/opções nesta pesquisa.</p>';
  return groups.map((g) => `<div class="tally-block">
      <h4>${escapeHtml(g.q.label || '')} <span class="muted small">(${g.answered} responderam)</span></h4>
      <table class="resp-table"><thead><tr><th>Opção</th><th>Votos</th><th>%</th></tr></thead><tbody>
      ${g.rows.map((r) => `<tr><td>${r.meta && r.meta.image ? `<img class="tally-photo" src="/api/files/${r.meta.image}">` : ''}${escapeHtml(r.label)}${r.meta && r.meta.sub ? ` <span class="muted small">(${escapeHtml(r.meta.sub)})</span>` : ''}</td><td>${r.count}</td><td>${g.answered ? Math.round((r.count * 100) / g.answered) : 0}%</td></tr>`).join('')}
      </tbody></table>
    </div>`).join('');
}
function responsesTableHtml(survey, responses, role) {
  const cols = survey.questions || [];
  if (!responses.length) return '<p class="muted">Ainda não há respostas.</p>';
  const header = `<tr><th>Data</th>${cols.map((q) => `<th>${escapeHtml(q.label || '')}</th>`).join('')}${role === 'admin' ? '<th>Ações</th>' : ''}</tr>`;
  const rows = responses.map((r) => `<tr>
    <td>${formatDate(r.submittedAt)}</td>
    ${cols.map((q) => `<td>${renderAnswerCell(q, r)}</td>`).join('')}
    ${role === 'admin' ? `<td><button class="icon-btn r-del" data-rid="${r.id}" title="Excluir">🗑</button></td>` : ''}
  </tr>`).join('');
  const hasChoice = cols.some((q) => q.type === 'single_choice' || q.type === 'multi_choice');
  return `<div class="resp-toolbar"><span class="muted">${responses.length} resposta(s)</span>
      <span>${hasChoice ? '<button class="btn ghost small" id="toggle-tally">Ver resumo de votos</button> ' : ''}<button class="btn ghost small" id="export-csv">Exportar CSV</button></span>
    </div>
    ${hasChoice ? `<div id="tally-section" style="display:none;">${tallySectionHtml(survey, responses)}</div>` : ''}
    <div class="table-wrap"><table class="resp-table"><thead>${header}</thead><tbody>${rows}</tbody></table></div>`;
}
function exportResponsesCsv(survey, responses) {
  const cols = survey.questions || [];
  const header = ['Data', ...cols.map((q) => q.label || '')];
  const lines = [header.map(csvEscape).join(',')];
  for (const r of responses) {
    const row = [formatDate(r.submittedAt)];
    for (const q of cols) {
      if (q.type === 'file') row.push(((r.files && r.files[q.id]) || []).map((f) => f.name).join('; '));
      else if (q.type === 'location') { const loc = r.answers ? r.answers[q.id] : null; row.push(loc && typeof loc.lat === 'number' ? loc.lat + ',' + loc.lng : ''); }
      else { const val = r.answers ? r.answers[q.id] : ''; row.push(Array.isArray(val) ? val.join('; ') : (val == null ? '' : String(val))); }
    }
    lines.push(row.map(csvEscape).join(','));
  }
  const csv = String.fromCharCode(0xFEFF) + lines.join('\r\n');
  triggerBlobDownload(new Blob([csv], { type: 'text/csv;charset=utf-8;' }), (survey.title || 'respostas').replace(/[^a-z0-9]+/gi, '_') + '.csv');
}
async function downloadProtectedFile(fileId, filename, role) {
  try {
    const headers = {};
    if (role === 'admin') headers['Authorization'] = 'Bearer ' + ADMIN_TOKEN;
    if (role === 'coord') headers['Authorization'] = 'Bearer ' + COORD_TOKEN;
    const res = await fetch('/api/files/' + fileId, { headers });
    if (!res.ok) throw new Error('falha');
    triggerBlobDownload(await res.blob(), filename);
  } catch (err) { showError('Não foi possível baixar o arquivo.'); }
}
function bindResponsesEvents(targetId, survey, responses, role) {
  const container = document.getElementById(targetId);
  const exportBtn = container.querySelector('#export-csv');
  if (exportBtn) exportBtn.onclick = () => exportResponsesCsv(survey, responses);
  const tallyBtn = container.querySelector('#toggle-tally');
  if (tallyBtn) tallyBtn.onclick = () => {
    const sec = container.querySelector('#tally-section');
    const show = sec.style.display === 'none';
    sec.style.display = show ? 'block' : 'none';
    tallyBtn.textContent = show ? 'Ver tabela de respostas' : 'Ver resumo de votos';
  };
  container.querySelectorAll('.file-link').forEach((a) => a.addEventListener('click', (e) => { e.preventDefault(); downloadProtectedFile(a.dataset.fileid, a.dataset.filename, role); }));
  if (role === 'admin') {
    container.querySelectorAll('.r-del').forEach((btn) => btn.addEventListener('click', () => withAuthGuard('admin', async () => {
      if (!confirm('Excluir esta resposta?')) return;
      await api(`/admin/surveys/${survey.id}/responses/${btn.dataset.rid}`, { method: 'DELETE', auth: 'admin' });
      renderResponsesInto(targetId, survey, role);
    })));
  }
}
async function renderResponsesInto(targetId, survey, role) {
  const target = document.getElementById(targetId);
  target.innerHTML = '<p class="muted">Carregando respostas...</p>';
  const path = role === 'admin' ? `/admin/surveys/${survey.id}/responses` : `/coord/surveys/${survey.id}/responses`;
  const responses = await api(path, { auth: role });
  target.innerHTML = responsesTableHtml(survey, responses, role);
  bindResponsesEvents(targetId, survey, responses, role);
}

// ---------- grupos ----------
async function renderAdminGroups() {
  const groups = await api('/admin/groups', { auth: 'admin' });
  const content = document.getElementById('content');
  content.innerHTML = `
    <div class="panel-head"><h2>Grupos e coordenadores</h2><button class="btn" id="new-group">+ Novo grupo</button></div>
    <p class="muted">Cada pesquisa pertence a um grupo. O coordenador de um grupo só vê as pesquisas e respostas desse grupo.</p>
    <div class="table-wrap"><table class="resp-table"><thead><tr><th>Grupo</th><th>Usuário do coordenador</th><th>Ações</th></tr></thead>
    <tbody>${groups.map((g) => `<tr>
      <td>${escapeHtml(g.name)}</td>
      <td>${escapeHtml(g.coordUsername)}</td>
      <td><button class="icon-btn g-edit" data-id="${g.id}" title="Editar">✏️</button><button class="icon-btn g-del" data-id="${g.id}" title="Excluir">🗑</button></td>
    </tr>`).join('') || '<tr><td colspan="3" class="muted">Nenhum grupo ainda.</td></tr>'}</tbody></table></div>`;
  document.getElementById('new-group').onclick = () => openGroupForm(null);
  content.querySelectorAll('.g-edit').forEach((b) => b.addEventListener('click', () => openGroupForm(groups.find((g) => g.id === b.dataset.id))));
  content.querySelectorAll('.g-del').forEach((b) => b.addEventListener('click', () => withAuthGuard('admin', async () => {
    if (!confirm('Excluir este grupo? Só é possível se não houver pesquisas nele.')) return;
    try { await api('/admin/groups/' + b.dataset.id, { method: 'DELETE', auth: 'admin' }); renderAdminGroups(); }
    catch (err) { showError(err.data && err.data.error === 'group_has_surveys' ? 'Não é possível excluir: existem pesquisas nesse grupo.' : 'Erro ao excluir grupo.'); }
  })));
}
function openGroupForm(group) {
  const overlay = document.createElement('div');
  overlay.innerHTML = `<div class="overlay"><div class="modal">
    <h3>${group ? 'Editar grupo' : 'Novo grupo'}</h3>
    <label>Nome do grupo<input id="gf-name" value="${group ? escapeHtml(group.name) : ''}" placeholder="Ex: Escola Municipal X"></label>
    <label>Usuário do coordenador<input id="gf-user" value="${group ? escapeHtml(group.coordUsername) : ''}" placeholder="Ex: coord.escolax"></label>
    <label>Senha do coordenador<input id="gf-pass" type="text" placeholder="${group ? 'deixe em branco para manter a atual' : 'defina uma senha'}"></label>
    <p class="muted small">Dica: você pode repetir o mesmo usuário/senha em mais de um grupo — assim esse coordenador enxerga vários grupos ao mesmo tempo.</p>
    <div class="modal-actions">
      <button class="btn ghost" id="gf-cancel">Cancelar</button>
      <button class="btn" id="gf-save">Salvar</button>
    </div>
  </div></div>`;
  document.body.appendChild(overlay);
  overlay.querySelector('#gf-cancel').onclick = () => overlay.remove();
  overlay.querySelector('#gf-save').onclick = () => withAuthGuard('admin', async () => {
    const name = overlay.querySelector('#gf-name').value.trim();
    const coordUsername = overlay.querySelector('#gf-user').value.trim();
    const coordPassword = overlay.querySelector('#gf-pass').value;
    if (!name || !coordUsername) return showError('Preencha nome e usuário.');
    if (group) {
      await api('/admin/groups/' + group.id, { method: 'PUT', auth: 'admin', body: { name, coordUsername, coordPassword: coordPassword || undefined } });
    } else {
      if (!coordPassword) return showError('Defina uma senha para o coordenador.');
      await api('/admin/groups', { method: 'POST', auth: 'admin', body: { name, coordUsername, coordPassword } });
    }
    overlay.remove();
    renderAdminGroups();
  });
}

// ---------- configurações ----------
async function renderAdminSettings() {
  const content = document.getElementById('content');
  content.innerHTML = `
    <div class="panel-head"><h2>Configurações</h2></div>
    <div class="settings-card">
      <h3 style="margin-top:0;">Trocar senha de administrador</h3>
      <label>Senha atual<input id="cp-old" type="password"></label>
      <label>Nova senha<input id="cp-new" type="password"></label>
      <button class="btn" id="cp-save">Salvar nova senha</button>
    </div>
    <div class="settings-card">
      <h3 style="margin-top:0;">Seu link de acesso</h3>
      <p class="muted small">Guarde este link nos favoritos — ele é sua entrada secreta no painel. Não compartilhe com ninguém.</p>
      <code class="link-box">${escapeHtml(location.origin + '/#/admin/' + lastUsedSecret)}</code>
    </div>`;
  document.getElementById('cp-save').onclick = () => withAuthGuard('admin', async () => {
    const oldPassword = document.getElementById('cp-old').value;
    const newPassword = document.getElementById('cp-new').value;
    if (!oldPassword || !newPassword) return showError('Preencha os dois campos.');
    try { await api('/admin/change-password', { method: 'POST', auth: 'admin', body: { oldPassword, newPassword } }); showToast('Senha alterada com sucesso.'); }
    catch (err) { showError('Senha atual incorreta.'); }
  });
}

// ============================================================
// coordenador
// ============================================================
function coordLoginTemplate() {
  return `<div class="auth-wrap"><form id="coord-login-form" class="auth-card">
    <h2>Acesso do coordenador</h2>
    <label>Usuário<input id="coord-user" type="text" autofocus required></label>
    <label>Senha<input id="coord-pass" type="password" required></label>
    <button type="submit" class="btn full">Entrar</button>
  </form></div>`;
}
async function renderCoordEntry() {
  if (COORD_TOKEN) return renderCoordDashboard();
  app().innerHTML = coordLoginTemplate();
  document.getElementById('coord-login-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const username = document.getElementById('coord-user').value;
    const password = document.getElementById('coord-pass').value;
    const btn = e.target.querySelector('button');
    btn.disabled = true;
    try {
      const { token, groupIds } = await api('/coord/login', { method: 'POST', body: { username, password } });
      COORD_TOKEN = token; COORD_GROUPS = groupIds;
      sessionStorage.setItem('cp_coord_token', token);
      sessionStorage.setItem('cp_coord_groups', JSON.stringify(groupIds));
      renderCoordDashboard();
    } catch (err) { showError('Usuário ou senha inválidos.'); btn.disabled = false; }
  });
}
function logoutCoord() {
  COORD_TOKEN = null; COORD_GROUPS = [];
  sessionStorage.removeItem('cp_coord_token');
  sessionStorage.removeItem('cp_coord_groups');
  renderCoordEntry();
}
async function renderCoordDashboard() {
  app().innerHTML = `<div class="shell">
    <header class="topbar">
      <div class="brand">📋 Central de Pesquisas <span class="badge">coordenador</span></div>
      <button class="btn ghost" id="logout-btn">Sair</button>
    </header>
    <main id="content" class="content"></main>
  </div>`;
  document.getElementById('logout-btn').onclick = logoutCoord;
  await withAuthGuard('coord', renderCoordSurveysList);
}
async function renderCoordSurveysList() {
  const surveys = await api('/coord/surveys', { auth: 'coord' });
  const content = document.getElementById('content');
  content.innerHTML = `
    <div class="panel-head"><h2>Pesquisas do seu grupo</h2></div>
    <div class="table-wrap"><table class="resp-table"><thead><tr><th>Pesquisa</th><th>Status</th><th>Respostas</th><th></th></tr></thead>
    <tbody>${surveys.map((s) => `<tr>
      <td>${escapeHtml(s.title)}</td>
      <td><span class="status-badge status-${s.status}">${statusLabel(s.status)}</span></td>
      <td>${s.responseCount}</td>
      <td><button class="btn ghost small c-view" data-id="${s.id}">Ver respostas</button></td>
    </tr>`).join('') || '<tr><td colspan="4" class="muted">Nenhuma pesquisa no seu grupo ainda.</td></tr>'}</tbody></table></div>
    <div id="coord-responses" style="margin-top:20px;"></div>`;
  content.querySelectorAll('.c-view').forEach((b) => b.addEventListener('click', () => withAuthGuard('coord', async () => {
    coordCurrentSurvey = await api('/coord/surveys/' + b.dataset.id, { auth: 'coord' });
    const panel = document.getElementById('coord-responses');
    panel.innerHTML = `<h3>${escapeHtml(coordCurrentSurvey.title)} — respostas</h3><div id="coord-resp-body"></div>`;
    await renderResponsesInto('coord-resp-body', coordCurrentSurvey, 'coord');
  })));
}
